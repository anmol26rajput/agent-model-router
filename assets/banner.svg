<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="model-router: the right model for every message">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="1" stop-color="#120a1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="repeat">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.33" stop-color="#a78bfa"/>
      <stop offset="0.66" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typing">
      <rect x="0" y="200" height="60" width="0">
        <animate attributeName="width" values="0;1200;1200;0" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-weight:800}
      .s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .g1{animation:g1 3.2s infinite steps(1)}
      .g2{animation:g2 3.2s infinite steps(1)}
      @keyframes g1{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-6px,2px);opacity:.8}91%{transform:translate(5px,-3px);opacity:.8}94%{opacity:0}}
      @keyframes g2{0%,86%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(6px,-2px);opacity:.8}92%{transform:translate(-4px,3px);opacity:.8}95%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>

  <!-- drifting grid -->
  <g>
    <rect x="-40" y="-40" width="1280" height="420" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- three tier orbs breathing out of phase -->
  <circle cx="170" cy="90" r="70" fill="#22d3ee" filter="url(#glow)" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;110;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="80" r="80" fill="#a78bfa" filter="url(#glow)" opacity="0.35">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;80" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="290" r="70" fill="#fb923c" filter="url(#glow)" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.45;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- tier chips -->
  <g class="s" font-size="15" font-weight="700">
    <g transform="translate(355 56)">
      <rect width="130" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee"/>
      <text x="65" y="21" text-anchor="middle" fill="#67e8f9">LIGHT</text>
      <animate attributeName="opacity" values="1;0.35;0.35;1" keyTimes="0;0.33;0.95;1" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(535 56)">
      <rect width="130" height="32" rx="16" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa"/>
      <text x="65" y="21" text-anchor="middle" fill="#c4b5fd">REGULAR</text>
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.33;0.66;1" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(715 56)">
      <rect width="130" height="32" rx="16" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c"/>
      <text x="65" y="21" text-anchor="middle" fill="#fdba74">HEAVY</text>
      <animate attributeName="opacity" values="0.35;0.35;1;0.35" keyTimes="0;0.33;0.66;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- glitch title -->
  <g class="t" font-size="92" text-anchor="middle">
    <text x="600" y="180" fill="#22d3ee" class="g1">model-router</text>
    <text x="600" y="180" fill="#fb923c" class="g2">model-router</text>
    <text x="600" y="180" fill="url(#title)" filter="url(#soft)">model-router</text>
  </g>

  <!-- typed tagline -->
  <g clip-path="url(#typing)">
    <text x="600" y="240" class="s" font-size="26" fill="#e5e7eb" text-anchor="middle">the right model for every message_</text>
  </g>

  <text x="600" y="296" class="s" font-size="16" fill="#9ca3af" text-anchor="middle">haiku for the small stuff · sonnet for the daily grind · opus for the hard thinking</text>
</svg>
